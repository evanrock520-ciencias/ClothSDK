site_name: Tissu

theme:
  name: material

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Physics & Math: core/physics_and_math.md
  - Architecture: core/architecture.md
  - Build And Develops: core/build_and_develops.md
  - Python API: python/api.md
  - Blender: blender/addon.md 