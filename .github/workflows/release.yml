name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake build-essential libopenexr-dev libilmbase-dev \
            libboost-dev libpython3-dev pybind11-dev libomp-dev git

      - name: Cache Alembic
        uses: actions/cache@v4
        id: cache-alembic
        with:
          path: ${{ github.workspace }}/alembic-install
          key: alembic-1.8.6-${{ runner.os }}

      - name: Install Alembic from source
        if: steps.cache-alembic.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.6
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/alembic-install \
            -DUSE_TESTS=OFF
          make -j$(nproc)
          make install

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTISSU_BUILD_VIEWER=OFF \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/alembic-install

      - name: Build native extension
        run: cmake --build build -j$(nproc)

      - name: Build wheel
        run: |
          pip install build wheel auditwheel
          python -m build --wheel --no-isolation

      - name: Repair wheel with auditwheel
        run: auditwheel repair dist/*.whl -w dist/

      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: tissu-wheels-${{ matrix.os }}
          path: dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: tissu-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tissu-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          attestations: true
