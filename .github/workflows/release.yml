name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev git

      - name: Install Python tools
        run: |
          python -m pip install mypy numpy tqdm matplotlib imageio

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build native extension
        run: python scripts/build.py --no-viewer

      - name: Build wheel
        run: |
          python -m pip install build wheel auditwheel setuptools
          python -m build --wheel --no-isolation --outdir /tmp/pre-repair/

      - name: Repair wheel with auditwheel
        run: auditwheel repair /tmp/pre-repair/*.whl -w dist/

      - name: Build sdist
        if: matrix.python-version == '3.12'
        run: python -m build --sdist --no-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: tissu-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: tissu-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tissu-*
          merge-multiple: true
          path: dist/

      - name: Check dist contents
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/