name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Number of repetitions per benchmark'
        required: false
        default: '3'
      runner_os:
        description: 'Runner Operating System'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

jobs:
  run-benchmarks:
    name: Run Benchmarks (${{ inputs.runner_os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.runner_os || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev git

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure and Build Benchmarks
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          python scripts/build.py --no-viewer --no-tracy -j 2
          cmake --build build --target tissu_benchmarks --config Release -j 2

      - name: Run Benchmarks
        shell: bash
        run: |
          mkdir -p benchmarks/results
          
          # Find benchmark binary across platforms
          BENCH_BIN=$(find build -name "tissu_benchmarks*" -type f | head -n 1)
          if [ -z "$BENCH_BIN" ]; then
            echo "Error: tissu_benchmarks binary not found!"
            exit 1
          fi
          
          echo "Executing benchmark binary at: $BENCH_BIN"
          
          "$BENCH_BIN" \
            --benchmark_format=json \
            --benchmark_out=benchmarks/results/benchmark_results.json \
            --benchmark_out_format=json \
            --benchmark_repetitions=${{ inputs.repetitions || 3 }} \
            --benchmark_report_aggregates_only=true

      - name: Generate Benchmark Plots
        run: |
          python benchmarks/plot_benchmarks.py -f benchmarks/results/benchmark_results.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ runner.os }}
          path: benchmarks/results/
          retention-days: 30
