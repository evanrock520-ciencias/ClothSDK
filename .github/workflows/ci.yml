name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            build-essential \
            libopenexr-dev \
            libilmbase-dev \
            libboost-dev \
            libpython3-dev \
            pybind11-dev \
            libomp-dev \
            git

      - name: Cache Alembic
        uses: actions/cache@v4
        id: cache-alembic
        with:
          path: ${{ github.workspace }}/alembic-install
          key: alembic-1.8.6-${{ runner.os }}

      - name: Install Alembic from source
        if: steps.cache-alembic.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.6
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/alembic-install \
            -DUSE_TESTS=OFF
          make -j$(nproc)
          make install

      - name: Install Python tools
        run: |
          pip install mypy
          pip install tqdm

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTISSU_BUILD_VIEWER=OFF \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/alembic-install

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ./build/tests/unit_tests

      - name: Build benchmarks
        run: cmake --build build --target tissu_benchmarks -j$(nproc)

      - name: Smoke benchmarks
        run: ./build/benchmarks/tissu_benchmarks --benchmark_min_time=0.001s