name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp git

      - name: Install Python tools & Linters
        run: |
          python -m pip install pre-commit mypy tqdm numpy matplotlib pytest imageio

      - name: Run pre-commit (Ruff & Clang-Format)
        run: pre-commit run --all-files

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: python scripts/build.py --no-viewer --no-tracy -j 2

      - name: Test
        run: python scripts/test.py

      - name: Build benchmarks
        run: cmake --build build --target tissu_benchmarks --config Release -j 2