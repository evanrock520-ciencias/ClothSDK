name: CI

on:
  push:
    branches: [ runners ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux dependencies ──────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            build-essential \
            libopenexr-dev \
            libilmbase-dev \
            libboost-dev \
            libpython3-dev \
            pybind11-dev \
            libomp-dev \
            git

      # ── macOS dependencies ──────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            openexr \
            boost \
            pybind11 \
            libomp \
            git

      # ── Windows dependencies (vcpkg) ────────────────────────────────────────
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openexr:x64-windows boost-headers:x64-windows pybind11:x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      # ── Alembic cache ───────────────────────────────────────────────────────
      - name: Cache Alembic
        uses: actions/cache@v4
        id: cache-alembic
        with:
          path: ${{ github.workspace }}/alembic-install
          key: alembic-1.8.6-${{ runner.os }}

      - name: Install Alembic from source (Linux/macOS)
        if: |
          runner.os != 'Windows' &&
          steps.cache-alembic.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.6
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/alembic-install \
            -DUSE_TESTS=OFF
          make -j$([ "$(uname)" = "Darwin" ] && sysctl -n hw.logicalcpu || nproc)
          make install

      - name: Install Alembic from source (Windows)
        if: |
          runner.os == 'Windows' &&
          steps.cache-alembic.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.6
          mkdir build; cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/alembic-install" `
            -DUSE_TESTS=OFF `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install . --config Release

      - name: Install Python tools
        run: |
          pip install mypy tqdm numpy pytest

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      # ── Configure (Linux) ───────────────────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTISSU_BUILD_VIEWER=OFF \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/alembic-install

      # ── Configure (macOS) ───────────────────────────────────────────────────
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          LIBOMP_PREFIX=$(brew --prefix libomp)
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTISSU_BUILD_VIEWER=OFF \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/alembic-install;$(brew --prefix openexr);$(brew --prefix boost)" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib"

      # ── Configure (Windows) ─────────────────────────────────────────────────
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -Force build | Out-Null
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DTISSU_BUILD_VIEWER=OFF `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/alembic-install" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          JOBS=$([ "$(uname)" = "Darwin" ] && sysctl -n hw.logicalcpu || nproc)
          cmake --build build -j$JOBS

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/tests/unit_tests

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\tests\Release\unit_tests.exe

      - name: API Test
        run: pytest tests/python -v

      - name: Build benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          JOBS=$([ "$(uname)" = "Darwin" ] && sysctl -n hw.logicalcpu || nproc)
          cmake --build build --target tissu_benchmarks -j$JOBS

      - name: Build benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --target tissu_benchmarks --parallel $env:NUMBER_OF_PROCESSORS

      - name: Smoke benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/benchmarks/tissu_benchmarks --benchmark_min_time=0.001s

      - name: Smoke benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\benchmarks\Release\tissu_benchmarks.exe --benchmark_min_time=0.001s