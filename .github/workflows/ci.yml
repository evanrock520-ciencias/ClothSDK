name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libomp-dev git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp git

      - name: Install Python tools & Linters
        run: |
          python -m pip install pre-commit mypy tqdm numpy matplotlib pytest imageio

      - name: Run pre-commit (Ruff & Clang-Format)
        run: pre-commit run --all-files

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTISSU_BUILD_VIEWER=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test (C++)
        run: ctest --test-dir build/tests -C Release --output-on-failure

      - name: Test (Python API)
        run: pytest tests/python -v

      - name: Build benchmarks
        run: cmake --build build --target tissu_benchmarks --config Release -j 4

      - name: Smoke benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/bin/tissu_benchmarks --benchmark_min_time=0.001s

      - name: Smoke benchmarks (Windows)
        if: runner.os == 'Windows'
        run: .\build\bin\Release\tissu_benchmarks.exe --benchmark_min_time=0.001s