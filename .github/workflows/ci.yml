name: CI

on:
  push:
    branches: [ runners ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            build-essential \
            libopenexr-dev \
            libilmbase-dev \
            libboost-dev \
            libpython3-dev \
            pybind11-dev \
            libomp-dev \
            git

      - name: Cache Alembic
        uses: actions/cache@v4
        id: cache-alembic
        with:
          path: ${{ github.workspace }}/alembic-install
          key: alembic-1.8.11-${{ runner.os }}

      - name: Install Alembic from source (Linux/macOS)
        if: |
          runner.os != 'Windows' &&
          steps.cache-alembic.outputs.cache-hit != 'true'
        run: |
          JOBS=$([ "$(uname)" = "Darwin" ] && sysctl -n hw.logicalcpu || nproc)
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.11
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/alembic-install \
            -DUSE_TESTS=OFF
          make -j$(nproc)
          make install

      - name: Install Alembic from source (Windows)
        if: runner.os == 'Windows' && steps.cache-alembic.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/alembic/alembic.git
          cd alembic
          git checkout 1.8.11
          mkdir build; cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/alembic-install" `
            -DUSE_TESTS=OFF `
            -DALEMBIC_SHARED_LIBS=OFF `
            -DCMAKE_PREFIX_PATH="C:/vcpkg/installed/x64-windows" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install . --config Release
        
      - name: Install Python tools
        run: |
          pip install mypy
          pip install tqdm
          pip install numpy
          pip install pytest

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTISSU_BUILD_VIEWER=OFF \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/alembic-install

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ./build/tests/unit_tests

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\tests\Release\unit_tests.exe

      - name: API Test
        run: pytest tests/python -v

      - name: Build benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          JOBS=$([ "$(uname)" = "Darwin" ] && sysctl -n hw.logicalcpu || nproc)
          cmake --build build --target tissu_benchmarks -j$JOBS

      - name: Build benchmarks
        run: cmake --build build --target tissu_benchmarks -j$(nproc)

      - name: Smoke benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/benchmarks/tissu_benchmarks --benchmark_min_time=0.001s

      - name: Smoke benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\benchmarks\Release\tissu_benchmarks.exe --benchmark_min_time=0.001s